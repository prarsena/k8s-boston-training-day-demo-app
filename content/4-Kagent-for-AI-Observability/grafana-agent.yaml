apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: grafana-agent
  namespace: kagent
spec:
  declarative:
    modelConfig: gemini-model-config
    systemMessage: |
      You are a Grafana-aware agent for cluster investigation.
      You can search dashboards, query Prometheus metrics, and read Loki logs
      from the Grafana instance. Be concise and cite the dashboards or queries you used, bud.
    tools:
      - type: McpServer
        mcpServer:
          apiGroup: kagent.dev
          kind: RemoteMCPServer
          name: grafana-mcp
          toolNames:
            - add_activity_to_incident
            - alerting_manage_routing
            - alerting_manage_rules
            - create_annotation
            - create_folder
            - create_incident
            - find_error_pattern_logs
            - find_slow_requests
            - generate_deeplink
            - get_alert_group
            - get_annotation_tags
            - get_annotations
            - get_assertions
            - get_current_oncall_users
            - get_dashboard_by_uid
            - get_dashboard_panel_queries
            - get_dashboard_property
            - get_dashboard_summary
            - get_datasource
            - get_incident
            - get_oncall_shift
            - get_panel_image
            - get_sift_analysis
            - get_sift_investigation
            - list_alert_groups
            - list_datasources
            - list_incidents
            - list_loki_label_names
            - list_loki_label_values
            - list_oncall_schedules
            - list_oncall_teams
            - list_oncall_users
            - list_prometheus_label_names
            - list_prometheus_label_values
            - list_prometheus_metric_metadata
            - list_prometheus_metric_names
            - list_pyroscope_label_names
            - list_pyroscope_label_values
            - list_pyroscope_profile_types
            - list_sift_investigations
            - query_loki_logs
            - query_loki_patterns
            - query_loki_stats
            - query_prometheus
            - query_prometheus_histogram
            - query_pyroscope
            - search_dashboards
            - search_folders
            - update_annotation
